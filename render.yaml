# Blueprint de Render (Infrastructure as Code). Render → New → Blueprint → elige este repo.
# Las variables marcadas con sync:false se piden en el panel al crear el servicio.
services:
  - type: web
    name: predictor-brotes-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migraciones + seed idempotente en cada arranque (el plan gratis no tiene "pre-deploy")
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@predictor.co
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SEED_CLIMA_REAL
        value: "true"
      - key: FRONTEND_URL
        sync: false
      # Alertas por correo (opcional): API key de https://resend.com y correos que reciben todas las alertas
      - key: RESEND_API_KEY
        sync: false
      - key: ALERTAS_EMAIL_DESTINO
        sync: false
      - key: ENTRENAR_AL_INICIO
        value: "true"
