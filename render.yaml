# Render Blueprint (infrastructure as code). Render → New → Blueprint → pick this repository.
# Variables marked sync:false are asked for in the dashboard when the service is created.
#
# One Docker web service runs the three microservices (gateway, engine, realtime) behind the Caddy
# edge proxy; see Dockerfile and deploy/. Variables renamed in v3 still accept their old Spanish
# names (MOTOR_GRPC_TOKEN, ALERTAS_EMAIL_DESTINO…), so an existing service keeps working.
services:
  - type: web
    name: predictor-brotes-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # /live does not query the database: Render calls it every few seconds, and /health would keep a
    # serverless PostgreSQL (Neon) awake around the clock and burn its free compute allowance.
    healthCheckPath: /live
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # Shared by the three services to authenticate each other inside the container
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        sync: false
      - key: ADMIN_EMAIL
        value: admin@predictor.co
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SEED_REAL_WEATHER
        value: "true"
      - key: FRONTEND_URL
        sync: false
      - key: REVALIDATE_SECRET
        sync: false
      # E-mail alerts (optional): API key from https://resend.com and the addresses that get every alert
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL_RECIPIENTS
        sync: false
      - key: TRAIN_ON_STARTUP
        value: "true"
      # The free plan sleeps after 15 min without inbound traffic. The service pings its own public
      # URL (RENDER_EXTERNAL_URL, set by Render) to stay awake. Render's 750 free hours a month cover
      # ONE service awake around the clock: with more free services, use e.g. "6-23" (local hours).
      - key: KEEP_AWAKE
        value: "true"
      - key: KEEP_AWAKE_HOURS
        value: "0-24"
      # Fewer engine threads keep the free plan's 512 MB comfortable
      - key: ENGINE_GRPC_THREADS
        value: "16"
