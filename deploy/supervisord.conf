; Process manager of the container: one program per microservice.
; Every program logs to the container's stdout with its service name as prefix (see
; volcano/shared/log_config.py), so Render's log view shows them interleaved but distinguishable.

[supervisord]
nodaemon=true
user=volcano
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; The engine is the CPU-heavy one (scikit-learn start-up, training). Lower priority (nice) keeps the
; API and the WebSocket hub responsive on a fraction of a CPU while it loads or trains.
[program:engine]
command=nice -n 10 python -m volcano.engine.server
priority=10
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=uvicorn volcano.gateway.app:app --host 127.0.0.1 --port 8001 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
priority=20
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:realtime]
command=uvicorn volcano.realtime.app:app --host 127.0.0.1 --port 8002 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
priority=20
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge]
command=caddy run --config deploy/Caddyfile --adapter caddyfile
priority=30
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; A service that keeps crashing must take the container down with it instead of leaving it half alive
; (see deploy/fail_fast.py).
[eventlistener:fail_fast]
command=python deploy/fail_fast.py
events=PROCESS_STATE_FATAL
priority=1
autorestart=true
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
