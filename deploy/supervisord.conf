; Process manager of the container: one program per microservice.
; Every program logs to the container's stdout with its service name as prefix (see
; volcano/shared/log_config.py), so Render's log view shows them interleaved but distinguishable.

[supervisord]
nodaemon=true
user=volcano
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:engine]
command=python -m volcano.engine.server
priority=10
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:gateway]
command=uvicorn volcano.gateway.app:app --host 127.0.0.1 --port 8001 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
priority=20
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:realtime]
command=uvicorn volcano.realtime.app:app --host 127.0.0.1 --port 8002 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-access-log
priority=20
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:edge]
command=caddy run --config deploy/Caddyfile --adapter caddyfile
priority=30
autorestart=true
startsecs=2
stopsignal=TERM
stopwaitsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
