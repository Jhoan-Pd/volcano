# Linter and style rules: `ruff check volcano tests alembic`
line-length = 120
target-version = "py312"
# Code generated by grpc_tools.protoc from proto/volcano/engine/v1/engine.proto
extend-exclude = ["volcano/rpc/*_pb2*.py", "volcano/rpc/*_pb2*.pyi"]

[lint]
select = [
  "E", "W", "F",   # pycodestyle and pyflakes: errors and unused names
  "B",             # bugbear: common mistakes (closures in loops, zip without strict…)
  "SIM",           # simplifications
  "C90",           # cyclomatic complexity
  "UP",            # modern Python 3.12 syntax
  "N",             # naming conventions
  "PERF",          # performance
  "PL",            # pylint
  "RUF",           # ruff's own rules
  "I",             # import order
  "S",             # bandit: security
  "ASYNC",         # async pitfalls (blocking calls inside coroutines)
]
ignore = [
  "B008",     # FastAPI uses Depends()/Query() as default values on purpose
  "N803", "N806",  # capital X/y: scikit-learn's convention for feature matrices
  "RUF001", "RUF002", "RUF003",  # Spanish typography (−, «», …) in user-facing strings
  "PLR2004",  # literal values in comparisons: thresholds named by their context
  "S101",     # assert is fine in tests and invariants
  "S608",     # the only dynamic SQL lives in migration 0004 and is built from constants
]

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-args = 8
max-positional-args = 8
max-statements = 60

[lint.per-file-ignores]
"tests/*" = ["PLC0415", "PLR0913", "PLR0917", "S105", "S106", "S603"]  # local imports, test secrets, alembic subprocess
"alembic/*" = ["E501"]
# gRPC servicer methods must be named like the RPCs in the .proto (PascalCase)
"volcano/engine/servicer.py" = ["N802"]
# Development defaults; production values come from the environment (see .env.example)
"volcano/shared/config.py" = ["S105"]
"volcano/schemas/auth.py" = ["S105"]  # "bearer" is a token type, not a password
