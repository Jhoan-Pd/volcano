# Continuous integration of the backend: quality, contracts, tests and the real container end to end.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Code quality (ruff)
        run: ruff check volcano tests alembic scripts
      - name: Generated gRPC code matches engine.proto
        run: bash scripts/generate_grpc.sh && git diff --exit-code volcano/rpc
      - name: Migrations on an empty database
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: alembic upgrade head && alembic check
      - run: pytest

  # The container exactly as Render runs it: edge proxy + gateway + engine + realtime, on PostgreSQL.
  container:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volcano
          POSTGRES_PASSWORD: volcano
          POSTGRES_DB: volcano
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U volcano" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx websockets
      - name: Build the image
        run: docker build -t volcano .
      - name: Start the container
        run: |
          # Like a hardened host (Render's sandbox): no Linux capabilities and no privilege escalation.
          # A binary that needs one — the stock Caddy carries a file capability — fails to start here
          # instead of on the first production deploy.
          docker run -d --name volcano --network host \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e PORT=10000 \
            -e DATABASE_URL=postgresql://volcano:volcano@127.0.0.1:5432/volcano \
            -e JWT_SECRET=ci-jwt-secret-with-more-than-32-bytes \
            -e CRON_SECRET=ci-cron -e INTERNAL_TOKEN=ci-internal \
            -e SEED_REAL_WEATHER=false -e TRENDS_ENABLED=false \
            volcano
      - name: Smoke test through the edge proxy (REST, gRPC, WebSocket)
        run: python scripts/smoke_test.py http://127.0.0.1:10000 --wait 300
      - name: Container logs
        if: always()
        run: docker logs volcano 2>&1 | tail -200
