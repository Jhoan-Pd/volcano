# Wake-up call for the Render free-plan backend.
#
# The service keeps ITSELF awake (volcano/realtime/keep_awake.py). What it cannot do is wake up once
# it is asleep — after a deploy, a restart, or the night hours configured in KEEP_AWAKE_HOURS — so
# this workflow knocks on the door a few times a day. It is a backup, not the keep-alive: GitHub
# runs scheduled workflows on a best-effort basis, often hours late.
#
# The ping goes to /live, which does not query the database.
name: Keep alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wake the backend up
        env:
          # Optional secret; without it the public URL of the deployment is used
          API_URL: ${{ secrets.API_URL || 'https://predictor-brotes-api.onrender.com' }}
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsS --max-time 20 "$API_URL/live"; then echo; echo "Backend awake (attempt $attempt)"; exit 0; fi
            echo "Attempt $attempt: the backend is not answering yet, waiting 15 s"
            sleep 15
          done
          echo "::error::The backend did not answer within about 4 minutes"
          exit 1
