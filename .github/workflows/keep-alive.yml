# Keeps the Render free-plan backend awake: it sleeps after 15 min without inbound traffic and takes
# about a minute to wake up (the first visit looked "frozen").
#
# Render gives 750 free hours per month per workspace: enough for ONE service awake all month.
# The ping goes to /health, which also queries the database.
# GitHub may delay cron jobs by a few minutes, so it is scheduled every 10 minutes.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the backend
        env:
          # Optional secret; without it the public URL of the deployment is used
          API_URL: ${{ secrets.API_URL || 'https://predictor-brotes-api.onrender.com' }}
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 30 "$API_URL/health"; then echo; echo "Backend awake"; exit 0; fi
            echo "Attempt $i: waking the backend up, waiting 20 s"
            sleep 20
          done
          echo "::warning::The backend did not answer within 3 minutes"
